<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book Sticker Admin</title>

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <!-- LOGIN -->
  <div id="loginScreen" class="login-container">

    <div class="login-card">
      <div class="logo">📚</div>

      <h1>Book Sticker Admin</h1>
      <p class="subtitle">Admin Login</p>

      <form id="loginForm">

        <input
          type="email"
          id="email"
          placeholder="Admin email"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >

        <button type="submit">
          🔐 Login
        </button>

      </form>

      <p id="loginError" class="error"></p>
    </div>

  </div>


  <!-- ADMIN DASHBOARD -->
  <div id="dashboard" class="hidden">

    <header class="topbar">

      <div>
        <h1>📚 Book Sticker Orders</h1>
        <p>Admin Dashboard</p>
      </div>

      <button id="logoutButton" class="logout">
        Logout
      </button>

    </header>


    <main class="container">

      <div class="stats">

        <div class="stat-card">
          <span>📦</span>
          <strong id="totalOrders">0</strong>
          <p>Total Orders</p>
        </div>

        <div class="stat-card">
          <span>🆕</span>
          <strong id="newOrders">0</strong>
          <p>New Orders</p>
        </div>

        <div class="stat-card">
          <span>💰</span>
          <strong id="pendingPayments">0</strong>
          <p>Pending Payments</p>
        </div>

        <div class="stat-card">
          <span>✅</span>
          <strong id="readyOrders">0</strong>
          <p>Ready Orders</p>
        </div>

      </div>


      <div class="orders-header">

        <h2>Orders</h2>

        <button id="refreshButton" class="refresh">
          🔄 Refresh
        </button>

      </div>


      <div id="ordersContainer">

        <div class="loading">
          Loading orders...
        </div>

      </div>

    </main>

  </div>


  <!-- Firebase -->
  <script type="module" src="admin.js"></script>

</body>
</html>
