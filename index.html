<!-- PAYMENT METHOD -->
<label for="payment">
  Payment Method *
</label>

<select
  id="payment"
  name="payment_method"
  required
>
  <option value="">
    Select payment method
  </option>

  <option value="UPI">
    UPI
  </option>

  <option value="Cash">
    Cash
  </option>
</select>


<!-- UPI PAYMENT -->
<div id="upiPayment" class="upi-box">

  <h3>📱 Pay with UPI</h3>

  <p>
    Scan the QR code below using any UPI app.
  </p>

  <img
    src="upi-qr.png"
    alt="UPI QR Code"
    class="upi-qr"
  >

  <p class="upi-note">
    After making the payment, click <strong>Place Order</strong>.
  </p>

</div>


<!-- CASH INFORMATION -->
<div id="cashPayment" class="cash-box">

  <div class="cash-icon">💵</div>

  <div>
    <strong>Payment: Cash</strong>

    <p>
      Pay in cash when you receive your stickers.
    </p>
  </div>

</div>
